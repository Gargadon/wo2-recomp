# Warriors Orochi 2 - recompilation config for the TU1-patched image.
#
# Image: Warriors Orochi 2 Title Update #1/default.xex + default.xexp
#   codegen applies the XEXP (code 82110000-824BFAC4, entry 823028F8);
#   the runtime only applies a patch it finds as <module>.xexp, so the same
#   default.xexp must also sit next to game:\default.xex.
#
# Rebuilt from scratch against the TU1 image. Every entry belongs to one of
# three groups, and each one was verified against the patched image:
#   * analysis: tail-branch targets the linear scan cannot attribute
#   * thunks:   MSVC adjustor thunks (addi r3,r3,-N; b target), only reachable
#               through vtables, so discovery never marks them
#   * vtable:   function pointers stored in .rdata/data that the vtable scanner
#               misses (verified: target is not already a function, has no
#               loc_ label, and follows a terminator instruction)

[functions]
# --- analysis: "unresolved call, target not in any function" ---
0x8234F280 = {}	# b 0x8234F280 from 0x8234FBEC
0x823473C0 = {}	# b 0x823473C0 from 0x8234FBC4

